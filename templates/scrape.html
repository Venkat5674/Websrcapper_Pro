<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper Pro - Scrape Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <style>
        /* Scrape-specific transitions */
        .result-card {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="min-h-screen relative flex flex-col font-sans text-slate-900 selection:bg-indigo-500 selection:text-white">

    <!-- Navbar (Simplified) -->
    <nav class="glass-nav fixed w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-6 h-20 flex justify-between items-center">
            <a href="/"
                class="flex items-center space-x-2 text-slate-600 hover:text-indigo-600 transition-colors group">
                <div class="bg-indigo-50 p-2 rounded-lg group-hover:bg-indigo-100 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </div>
                <span class="font-medium">Back to Home</span>
            </a>
            <span class="text-xl font-bold text-slate-800">Web<span class="text-indigo-600">Scraper</span>Pro</span>
        </div>
    </nav>

    <div class="flex-grow pt-28 pb-20 px-4">
        <!-- Main Container -->
        <div class="container mx-auto max-w-5xl">

            <!-- Input Section -->
            <div class="glass p-8 md:p-12 rounded-3xl shadow-2xl mb-12 transform transition-all hover:scale-[1.01] duration-500"
                data-aos="fade-down">
                <div class="text-center mb-10">
                    <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Start Scraping</h1>
                    <p class="text-slate-500 text-lg">Enter a URL below to extract data instantly.</p>
                </div>

                <form id="scrapeForm" class="max-w-3xl mx-auto space-y-6">
                    <div class="relative group">
                        <div
                            class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200">
                        </div>
                        <div class="relative">
                            <input type="url" id="url" name="url" required
                                class="w-full px-6 py-5 bg-white border-none rounded-xl text-lg shadow-sm focus:ring-0 placeholder-slate-400 text-slate-800"
                                placeholder="https://example.com">
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
                                    </path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <button type="submit"
                        class="btn-primary w-full py-5 text-lg shadow-xl hover:shadow-indigo-500/40 flex justify-center items-center gap-3 group">
                        <span>Run Scraper</span>
                        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Loading State -->
            <div class="loading hidden flex-col items-center justify-center p-16 glass rounded-3xl animate-pulse">
                <div class="loader-ring mb-6 scale-150">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <h3 class="text-2xl font-bold text-indigo-600 mb-2">Analyzing Webpage...</h3>
                <p class="text-slate-500">Extracting content, meta tags, and resources.</p>
            </div>

            <!-- Results Container -->
            <div id="results" class="space-y-8 hidden">

                <!-- Page Info -->
                <div class="result-card glass p-8 rounded-2xl border-l-4 border-indigo-500">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                        <svg class="w-7 h-7 text-indigo-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Page Information
                    </h2>
                    <div class="space-y-4">
                        <div class="p-4 bg-white/60 rounded-xl">
                            <label
                                class="block text-xs font-bold text-indigo-500 uppercase tracking-wide mb-1">Title</label>
                            <p id="pageTitle" class="text-lg text-slate-800 font-medium"></p>
                        </div>
                        <div class="p-4 bg-white/60 rounded-xl">
                            <label
                                class="block text-xs font-bold text-indigo-500 uppercase tracking-wide mb-1">Description</label>
                            <p id="pageDescription" class="text-slate-600"></p>
                        </div>
                    </div>
                </div>

                <!-- Headings -->
                <div class="result-card glass p-8 rounded-2xl border-l-4 border-purple-500">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                        <svg class="w-7 h-7 text-purple-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h7"></path>
                        </svg>
                        Headings Structure
                    </h2>
                    <ul id="headings" class="space-y-3 max-h-96 overflow-y-auto pr-2 custom-scrollbar"></ul>
                </div>

                <!-- Links -->
                <div class="result-card glass p-8 rounded-2xl border-l-4 border-pink-500">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                        <svg class="w-7 h-7 text-pink-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
                            </path>
                        </svg>
                        Extracted Links
                    </h2>
                    <div id="links" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <!-- Images -->
                <div class="result-card glass p-8 rounded-2xl border-l-4 border-blue-500">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                        <svg class="w-7 h-7 text-blue-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        Images Gallery
                    </h2>
                    <div id="images" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-area" class="fixed bottom-6 right-6 z-50"></div>

    <script>
        AOS.init();

        // Smooth Page Transitions
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');

            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href.startsWith('#') || href.startsWith('http') || this.target === '_blank') return;
                    e.preventDefault();
                    document.body.classList.remove('loaded');
                    setTimeout(() => window.location.href = href, 500);
                });
            });
        });

        // Form Submission Logic
        document.getElementById('scrapeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value;
            const loading = document.querySelector('.loading');
            const results = document.getElementById('results');
            const resultCards = document.querySelectorAll('.result-card');

            // UI State: Loading
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            results.classList.add('hidden');

            // Reset cards animations
            resultCards.forEach(card => card.classList.remove('visible'));

            try {
                const response = await fetch('/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });

                const data = await response.json();

                if (response.ok) {
                    // Populate Data
                    document.getElementById('pageTitle').textContent = data.title;
                    document.getElementById('pageDescription').textContent = data.meta_description;

                    // Headings
                    document.getElementById('headings').innerHTML = data.headings.map(h =>
                        `<li class="flex items-start p-3 bg-white/50 rounded-lg hover:bg-white transition-colors border border-transparent hover:border-indigo-100">
                            <span class="mt-1.5 w-2 h-2 rounded-full bg-indigo-500 mr-3 flex-shrink-0"></span>
                            <span class="text-slate-700 leading-relaxed">${h}</span>
                        </li>`
                    ).join('');

                    // Links
                    document.getElementById('links').innerHTML = data.links.slice(0, 20).map(link =>
                        `<a href="${link.href}" target="_blank" class="block p-4 bg-white/50 rounded-xl hover:bg-white transition-all hover:shadow-md border border-transparent hover:border-pink-100 group">
                            <div class="flex items-center justify-between">
                                <span class="text-slate-600 font-medium truncate group-hover:text-pink-600 transition-colors w-10/12">${link.text || 'Link'}</span>
                                <svg class="w-4 h-4 text-slate-400 group-hover:text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                            <div class="text-xs text-slate-400 mt-1 truncate">${link.href}</div>
                        </a>`
                    ).join('');

                    // Images
                    document.getElementById('images').innerHTML = data.images.slice(0, 12).map(img =>
                        `<div class="group relative aspect-video bg-gray-100 rounded-lg overflow-hidden shadow-sm hover:shadow-lg transition-all">
                             <img src="${img.src}" alt="${img.alt}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/300?text=No+Image';this.classList.add('opacity-50');">
                        </div>`
                    ).join('');

                    // Show Results
                    loading.classList.add('hidden');
                    loading.classList.remove('flex');
                    results.classList.remove('hidden');

                    // Staggered Animation
                    resultCards.forEach((card, index) => {
                        setTimeout(() => card.classList.add('visible'), index * 150);
                    });

                } else {
                    showNotification(data.error || 'Failed to scrape URL', 'error');
                    loading.classList.add('hidden');
                    loading.classList.remove('flex');
                }
            } catch (error) {
                showNotification(error.message, 'error');
                loading.classList.add('hidden');
                loading.classList.remove('flex');
            }
        });

        function showNotification(message, type) {
            const area = document.getElementById('notification-area');
            const notif = document.createElement('div');
            const colorClass = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            notif.className = `${colorClass} text-white px-6 py-4 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center mb-3`;
            notif.innerHTML = `<span>${message}</span>`;

            area.appendChild(notif);

            // Animate in
            setTimeout(() => {
                notif.classList.remove('translate-y-20', 'opacity-0');
            }, 10);

            // Remove
            setTimeout(() => {
                notif.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 4000);
        }
    </script>
</body>

</html>
